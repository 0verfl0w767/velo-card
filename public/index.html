<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>velo-card 생성기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #e5e8eb;
      --border-strong: #d1d6db;
      --text: #191f28;
      --sub: #4e5968;
      --muted: #8b95a1;
      --accent: #12b886;
      --accent-hover: #0ca678;
      --accent-soft: #e6fcf5;
      --radius: 12px;
      --font: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar {
      max-width: 1360px;
      margin: 0 auto;
      height: 50px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.02em;
    }
    main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 510px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1024px) {
      main { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 12px; }
      .preview-col { position: static !important; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      min-width: 0;
    }
    .controls-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .preview-col {
      position: sticky;
      top: 66px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 10px;
      gap: 8px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      line-height: 1.2;
    }
    .section-sub {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.2;
    }
    .top-inputs {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    @media (max-width: 560px) {
      .top-inputs { grid-template-columns: 1fr; }
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--sub);
      display: flex;
      align-items: center;
      justify-content: space-between;
      line-height: 1.2;
    }
    .val-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--accent-hover);
      font-weight: 700;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      height: 32px;
      padding: 0 9px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      font-size: 12px;
      color: var(--text);
      background: #fff;
      font-family: inherit;
      line-height: 1;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--accent);
    }
    input[type="range"] {
      width: 100%;
      margin: 3px 0 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .input-group {
      display: flex;
      gap: 5px;
    }
    .input-prefix {
      display: flex;
      align-items: center;
      flex: 1;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #fff;
      overflow: hidden;
      height: 32px;
    }
    .input-prefix:focus-within { border-color: var(--accent); }
    .input-prefix span {
      padding: 0 3px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }
    .input-prefix input {
      border: 0;
      padding-left: 0;
      height: 30px;
    }
    .btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #f1f3f5; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-sm {
      height: 28px;
      padding: 0 10px;
      font-size: 11.5px;
    }
    .layout-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .layout-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 52px;
      padding: 6px 4px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      color: var(--sub);
      transition: all 0.15s;
    }
    .layout-btn:hover { border-color: var(--accent); }
    .layout-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
    }
    .sliders-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }
    .pager {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pager-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      font-size: 12px;
      font-weight: 700;
    }
    .pager-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .pager-info {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      min-width: 34px;
      text-align: center;
      line-height: 1;
    }
    @media (max-width: 560px) {
      .topbar { padding: 0 12px; }
      .panel { padding: 12px; }
      .layout-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .sliders-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .theme-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grad-stops { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stage { padding: 14px 10px; min-height: 150px; }
      .seg button { padding: 0 7px; font-size: 11px; }
    }
    .theme-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      color: var(--sub);
      text-align: left;
      min-width: 0;
    }
    .theme-btn span.t-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.2;
    }
    .theme-btn:hover { border-color: var(--border-strong); }
    .theme-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
    }
    .swatch {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swatch-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }
    .seg {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      max-width: 100%;
      background: #f1f3f5;
      padding: 2px;
      border-radius: 7px;
      gap: 2px;
    }
    .seg button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      border: 0;
      background: transparent;
      padding: 0 9px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1;
      color: var(--sub);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .seg button.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .bg-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    @media (max-width: 560px) {
      .color-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .color-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .color-input {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 0 6px;
      height: 30px;
      background: #fff;
    }
    .color-input input[type="color"] {
      width: 18px;
      height: 18px;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    .color-input input[type="text"] {
      border: 0;
      height: 26px;
      padding: 0;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .color-clear {
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      padding: 0;
      line-height: 1;
      font-family: inherit;
    }
    .color-clear:hover { color: var(--text); }
    .grad-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .grad-stops {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .toggle-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      height: 32px;
      padding: 0 9px 0 11px;
      border: 1px solid var(--border-strong);
      border-radius: 99px;
      background: #fff;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1;
      color: var(--sub);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .toggle:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .toggle:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
    }
    .toggle.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .toggle:has(input:focus-visible) {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
    }
    .toggle .sw {
      position: relative;
      width: 26px;
      height: 15px;
      border-radius: 99px;
      background: #dee2e6;
      flex-shrink: 0;
      transition: background 0.16s;
    }
    .toggle .sw::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
      transition: transform 0.16s;
    }
    .toggle input:checked ~ .sw {
      background: var(--accent);
    }
    .toggle input:checked ~ .sw::after {
      transform: translateX(11px);
    }
    .stage {
      border-radius: 10px;
      border: 1px solid var(--border);
      min-height: 200px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: background-color 0.2s;
    }
    .stage.bg-light { background: #ffffff; }
    .stage.bg-dark { background: #0d1117; border-color: #30363d; }
    .stage.bg-checker {
      background-color: #f1f3f5;
      background-image: linear-gradient(45deg, #e2e6ea 25%, transparent 25%),
        linear-gradient(-45deg, #e2e6ea 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e2e6ea 75%),
        linear-gradient(-45deg, transparent 75%, #e2e6ea 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    .stage img {
      max-width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.15s;
    }
    .stage.loading img { opacity: 0.45; }
    .status-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      display: none;
      align-items: center;
      height: 22px;
      padding: 0 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
    }
    .stage.loading .status-pill { display: inline-flex; }
    .code-box {
      background: #1e1e2e;
      color: #cdd6f4;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 8px 0 0;
    }
    .hidden { display: none !important; }
    .tag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 26px;
      padding: 0 9px;
      border-radius: 99px;
      border: 1px solid var(--border-strong);
      background: #fff;
      color: var(--sub);
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .tag-chip:hover { border-color: var(--accent); }
    .tag-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
    }
    .tag-chip .cnt {
      font-size: 10px;
      opacity: 0.65;
    }
    .tag-panel.muted {
      opacity: 0.45;
      pointer-events: none;
    }
    footer {
      max-width: 1360px;
      margin: 0 auto;
      padding: 4px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--muted);
    }
    footer a {
      color: var(--sub);
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover { color: var(--accent-hover); }
    details {
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    details summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: var(--sub);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      line-height: 1.2;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #191f28;
      color: #fff;
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 50;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 192 192" aria-hidden="true">
          <rect width="192" height="192" rx="34" fill="#20c997"/>
          <path fill="#fff" d="M49 65.4v-6.4c7.2-1.4 17.6-2.3 25.3-2.3 6.5 0 8.9 3 8.9 8.4l-0.5 40.6c13.7-15.6 22-31.1 22-43.5 0-4-1-6.7-3.6-9.2 7.5-1.8 13.6-2.6 19.6-2.6 6.1 0 10.2 3 10.2 10.2 0 21.3-21.6 51.2-51.7 74.7-6.5 0-13.2 0.1-19.9 0.2l1.2-63.8c0-4.6-1.2-6.3-11.5-6.3z"/>
        </svg>
        <span>velo-card</span>
      </div>
      <button type="button" class="btn btn-sm" id="resetBtn">설정 초기화</button>
    </div>
  </header>

  <main>
    <div class="controls-col">
      <section class="panel">
        <div class="section-head">
          <h2 class="section-title">기본 및 레이아웃</h2>
        </div>
        <div class="top-inputs">
          <div class="field">
            <label for="username">velog 아이디</label>
            <div class="input-group">
              <div class="input-prefix">
                <span>@</span>
                <input id="username" type="text" value="velopert" placeholder="아이디" />
              </div>
              <button type="button" class="btn btn-primary" id="applyBtn">적용</button>
            </div>
          </div>
          <div class="field">
            <label for="tag">태그 필터</label>
            <input id="tag" type="text" placeholder="특정 태그만 (예: React)" />
          </div>
          <div class="field">
            <label for="title" id="titleLabel">목록 제목</label>
            <input id="title" type="text" placeholder="기본: 최근 게시글" />
          </div>
        </div>

        <div class="layout-grid" id="layoutGrid"></div>

        <div class="sliders-grid">
          <div class="field" id="countWrap">
            <label for="count">게시글 수 <span class="val-badge" id="countVal">5</span></label>
            <input id="count" type="range" min="0" max="10" value="5" />
          </div>
          <div class="field">
            <label for="width">너비 (px) <span class="val-badge" id="widthVal">495</span></label>
            <input id="width" type="range" min="300" max="1000" step="5" value="495" />
          </div>
          <div class="field" id="radiusWrap">
            <label for="radius">모서리 둥글기 <span class="val-badge" id="radiusVal">10</span></label>
            <input id="radius" type="range" min="0" max="30" value="10" />
          </div>
          <div class="field hidden" id="columnsWrap">
            <label for="columns">그리드 열 <span class="val-badge" id="columnsVal">2</span></label>
            <input id="columns" type="range" min="1" max="4" value="2" />
          </div>
          <div class="field" id="indexWrap">
            <label for="index">시작 글 (0 = 최신) <span class="val-badge" id="indexVal">0</span></label>
            <input id="index" type="range" min="0" max="20" value="0" />
          </div>
          <div class="field hidden" id="ratioWrap">
            <label for="thumbRatio">썸네일 비율</label>
            <select id="thumbRatio">
              <option value="0.52">기본 (약 2:1)</option>
              <option value="wide">와이드 (2:1)</option>
              <option value="video">와이드 (16:9)</option>
              <option value="classic">클래식 (4:3)</option>
              <option value="square">정사각형 (1:1)</option>
            </select>
          </div>
        </div>
      </section>

      <section class="panel tag-panel" id="tagPanel">
        <div class="section-head" style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px">
            <h2 class="section-title">프로필 태그 선택</h2>
            <span class="section-sub" id="tagPanelHint">클릭해서 추가 / 제외</span>
          </div>
          <div style="display:flex;gap:5px">
            <button type="button" class="btn btn-sm" id="tagsDefaultBtn">기본 6개</button>
            <button type="button" class="btn btn-sm" id="tagsClearBtn">모두 빼기</button>
          </div>
        </div>

    const OVERRIDE_FIELDS = [
      { param: "title_color", key: "title", label: "제목 색" },
      { param: "text_color", key: "text", label: "본문 색" },
      { param: "muted_color", key: "muted", label: "보조 색" },

      { param: "border_color", key: "border", label: "테두리 색" },

      { param: "chip_text_color", key: "chipText", label: "태그 글자" },

    const state = {
      name: "velopert",
      layout: "list",
      theme: "light",
      themePage: 0,
      count: 5,
      width: 495,
      columns: 2,
      index: 0,
      thumbRatio: "0.52",
      radius: 10,
      tag: "",
      tags: null,
      allTags: [],
      title: "",
      bgMode: "theme",

    const $ = (id) => document.getElementById(id);
    const HEX = /^([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
    const isLocal = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);

    function showToast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function renderLayoutButtons() {
      $("layoutGrid").innerHTML = Object.entries(LAYOUTS)
        .map(([k, v]) => `
          <button type="button" class="layout-btn${state.layout === k ? " active" : ""}" data-layout="${k}">
            <svg width="24" height="22" viewBox="0 0 28 26" fill="currentColor">${v.icon}</svg>
            <span>${v.label}</span>
          </button>`)
        .join("");
    }

    function renderThemeButtons() {
      const entries = Object.entries(THEMES);
      const perPage = 16;
      const totalPages = Math.ceil(entries.length / perPage);
      state.themePage = Math.max(0, Math.min(state.themePage, totalPages - 1));
      const slice = entries.slice(state.themePage * perPage, (state.themePage + 1) * perPage);
      $("themePageInfo").textContent = `${state.themePage + 1} / ${totalPages}`;
      $("themePrevBtn").disabled = state.themePage === 0;
      $("themeNextBtn").disabled = state.themePage >= totalPages - 1;
      $("themeGrid").innerHTML = slice
        .map(([k, v]) => {
          const bg = Array.isArray(v.bg)
            ? `linear-gradient(${v.angle}deg, ${v.bg.join(",")})`
            : v.bg === "#00000000"
            ? "repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 50%/8px 8px"
            : v.bg;
          return `
            <button type="button" class="theme-btn${state.theme === k ? " active" : ""}" data-theme="${k}" title="${k}">
              <span class="swatch" style="background:${bg}"><span class="swatch-dot" style="background:${v.accent}"></span></span>
              <span class="t-name">${k}</span>
            </button>`;
        })
        .join("");
    }

    function syncOverrideInputs() {
      const t = THEMES[state.theme] || THEMES.light;
      const box = $("colorOverrides");
      box.innerHTML = OVERRIDE_FIELDS.map((f) => {
        const val = state.colors[f.param] || "";
        const baseHex = t[f.key].slice(0, 7);
        const pickerVal = HEX.test(val) ? "#" + val.slice(0, 6) : baseHex;
        return `
          <div class="color-item">
            <label>${f.label}<button type="button" class="color-clear${val ? "" : " hidden"}" data-clear="${f.param}">초기화</button></label>
            <div class="color-input">
              <input type="color" data-cp="${f.param}" value="${pickerVal}" />
              <input type="text" data-ct="${f.param}" value="${val}" placeholder="${t[f.key].slice(1)}" />
            </div>
          </div>`;
      }).join("");
    }

    function getDisabledFlags() {
      const l = state.layout;
      const cnt = Number(state.count);
      const hp = Boolean(state.flags.hide_profile) && !(l === "compact" && cnt === 0);
      const hs = Boolean(state.flags.hide_stats);
      const hasStatsRow = l === "list" || l === "thumbnail" || l === "compact";
      const off = new Set();
      if (l === "compact" && cnt === 0) off.add("hide_profile");
      if (hp && l !== "grid") off.add("hide_avatar");
      if (hp || !hasStatsRow) {
        off.add("hide_bio");
        off.add("hide_stats");
      }
      if (hp || (hasStatsRow && hs)) off.add("hide_follow");
      if (
        l === "grid" ||
        (l === "compact" && hp) ||
        (l === "thumbnail" && hp && !state.flags.hide_description)
      ) {
        off.add("hide_tags");
      }
      if (l === "list" || l === "compact") off.add("hide_description");
      return off;
    }

    function updateVisibility() {
      const l = state.layout;
      $("count").min = l === "compact" ? "0" : "1";
      if (l !== "compact" && l !== "featured" && Number(state.count) < 1) {
        state.count = 1;
        $("count").value = 1;
      }
      const cnt = Number(state.count);
      const noPosts = l === "compact" && cnt === 0;
      $("countWrap").classList.toggle("hidden", l === "featured");
      $("columnsWrap").classList.toggle("hidden", l !== "grid" || cnt <= 1);
      if (l === "grid" && cnt > 1) {
        $("columns").max = String(Math.min(4, cnt));
        if (Number(state.columns) > Math.min(4, cnt)) {
          state.columns = Math.min(4, cnt);
          $("columns").value = state.columns;
        }
      }
      $("ratioWrap").classList.toggle("hidden", l !== "grid" && l !== "featured");
      $("indexWrap").classList.toggle("hidden", noPosts);
      $("tag").disabled = noPosts;
      $("tag").placeholder = noPosts ? "게시글 수 1 이상에서 사용" : "특정 태그만 (예: React)";
      $("bgSolidBox").classList.toggle("hidden", state.bgMode !== "solid");
      $("bgGradBox").classList.toggle("hidden", state.bgMode !== "gradient");
      const titleOff = l === "grid" || noPosts;
      $("title").disabled = titleOff;
      $("titleLabel").textContent = l === "featured" || l === "compact" ? "배지 문구" : "목록 제목";
      $("title").placeholder = titleOff
        ? "이 레이아웃에선 미사용"
        : l === "featured" || l === "compact"
        ? "기본: 최신 글"
        : "기본: 최근 게시글";
      $("countVal").textContent = state.count;
      $("widthVal").textContent = state.width;
      $("columnsVal").textContent = state.columns;
      $("indexVal").textContent = state.index;
      $("radiusVal").textContent = state.radius;
      $("gradAngleVal").textContent = state.gradAngle;

      const offFlags = getDisabledFlags();
      let activeFlags = 0;
      document.querySelectorAll("[data-flag]").forEach((cb) => {
        const disabled = offFlags.has(cb.dataset.flag);
        cb.disabled = disabled;
        cb.closest(".toggle").classList.toggle("disabled", disabled);
        if (!disabled && cb.checked) activeFlags++;
      });
      $("activeFlagCount").textContent = activeFlags ? `${activeFlags}개 적용됨` : "";

      const hp = Boolean(state.flags.hide_profile) && !noPosts;
      const tagsDisabled = l === "grid" || l === "featured" || hp || Boolean(state.flags.hide_tags);
      $("tagPanel").classList.toggle("muted", tagsDisabled);
      $("tagPanelHint").textContent =
        l === "grid" || l === "featured"
          ? "목록·썸네일·한 줄 배지에서만 표시"
          : hp
          ? "프로필 숨김이 켜져 있음"
          : state.flags.hide_tags
          ? "태그 숨김이 켜져 있음"
          : "클릭해서 추가 / 제외";
    }

    function renderProfileTags() {
      const box = $("profileTagChips");
      if (!state.allTags.length) {
        box.innerHTML = '<span class="section-sub">표시할 태그가 없습니다.</span>';
        return;
      }
      const activeSet = new Set(
        state.tags !== null ? state.tags : state.allTags.slice(0, 6).map((t) => t.name),
      );
      box.innerHTML = state.allTags
        .slice(0, 18)
        .map(
          (t) =>
            `<button type="button" class="tag-chip${activeSet.has(t.name) ? " active" : ""}" data-ptag="${t.name.replace(/"/g, "&quot;")}">#${t.name.replace(/</g, "&lt;")}<span class="cnt">${t.count}</span></button>`,
        )
        .join("");
    }

    async function loadUserTags(username) {
      const clean = (username || "velopert").trim().replace(/^@/, "") || "velopert";
      try {
        const res = await fetch(`${location.origin}/api?name=${encodeURIComponent(clean)}&meta=tags`);
        if (!res.ok) return;
        const json = await res.json();
        state.allTags = json.tags || [];
        renderProfileTags();
      } catch {}
    }

    function buildQuery(extra = {}) {
      const p = new URLSearchParams();
      const cleanName = (state.name || "velopert").trim().replace(/^@/, "") || "velopert";
      p.set("name", cleanName);

      const layoutDef = LAYOUTS[state.layout];
      if (state.layout !== "list") p.set("layout", state.layout);

      const theme = extra.theme || state.theme;
      if (theme !== "light") p.set("theme", theme);

      if (state.layout !== "featured" && Number(state.count) !== layoutDef.count) {
        p.set("count", state.count);
      }
      if (Number(state.width) !== layoutDef.width) p.set("width", state.width);
      if (state.layout === "grid" && Number(state.count) > 1 && Number(state.columns) !== Math.min(2, Math.max(Number(state.count), 1))) {
        p.set("columns", state.columns);
      }
      const noPosts = state.layout === "compact" && Number(state.count) === 0;
      if (!noPosts && Number(state.index) !== 0) p.set("index", state.index);
      if ((state.layout === "grid" || state.layout === "featured") && state.thumbRatio !== "0.52") {
        p.set("thumb_ratio", state.thumbRatio);
      }
      if (Number(state.radius) !== 10) p.set("border_radius", state.radius);
      if (!noPosts && state.tag.trim()) p.set("tag", state.tag.trim());
      const hp = Boolean(state.flags.hide_profile) && !noPosts;
      const tagsDisabled = state.layout === "grid" || state.layout === "featured" || hp || Boolean(state.flags.hide_tags);
      if (state.tags !== null && !tagsDisabled) {
        const def = state.allTags.slice(0, 6).map((t) => t.name);
        const sameAsDefault = state.tags.length === def.length && state.tags.every((v, i) => v === def[i]);
        if (!sameAsDefault) p.set("tags", state.tags.join(","));
      }
      const titleOff = state.layout === "grid" || noPosts;
      if (!titleOff && state.title.trim()) p.set("title", state.title.trim());

      if (state.bgMode === "solid" && HEX.test(state.bgSolid)) {
        p.set("bg_color", state.bgSolid.toLowerCase());
      } else if (state.bgMode === "gradient" && HEX.test(state.grad1) && HEX.test(state.grad2)) {
        const stops = [state.gradAngle, state.grad1, state.grad2];
        if (HEX.test(state.grad3)) stops.push(state.grad3);
        p.set("bg_color", stops.join(",").toLowerCase());
      } else if (state.bgMode === "transparent" && state.theme !== "transparent") {
        p.set("bg_color", "00000000");
      }

      for (const [k, v] of Object.entries(state.colors)) {
        if (HEX.test(v)) p.set(k, v.toLowerCase());
      }
      const offFlags = getDisabledFlags();
      for (const [k, v] of Object.entries(state.flags)) {
        if (v && !offFlags.has(k)) p.set(k, "true");
      }
      return p.toString();
    }

    function renderCode() {
      const origin = location.origin;
      const qs = buildQuery();
      const cleanName = (state.name || "velopert").trim().replace(/^@/, "") || "velopert";
      const imgUrl = `${origin}/api?${qs}`;
      const profileUrl = `https://velog.io/@${encodeURIComponent(cleanName)}`;

      $("openTabBtn").href = imgUrl;

      let out = "";
      if (state.codeTab === "markdown") {
        out = `[![velog](${imgUrl})](${profileUrl})`;
      } else if (state.codeTab === "html") {
        out = `<a href="${profileUrl}">\n  <img src="${imgUrl}" alt="${cleanName} velog" />\n</a>`;
      } else if (state.codeTab === "url") {
        out = imgUrl;
      } else {
        const darkUrl = `${origin}/api?${buildQuery({ theme: "github_dark" })}`;
        const lightUrl = `${origin}/api?${buildQuery({ theme: "github" })}`;
        out = `<a href="${profileUrl}">\n  <picture>\n    <source media="(prefers-color-scheme: dark)" srcset="${darkUrl}" />\n    <img src="${lightUrl}" alt="${cleanName} velog" />\n  </picture>\n</a>`;
      }
      $("codeOutput").textContent = out;
    }

    let loadTimer;
    let lastPreviewUrl = "";
    function refreshPreview(immediate = false, force = false) {
      updateVisibility();
      renderCode();
      const qs = buildQuery();
      const previewQs = state.flags.disable_animations ? qs : `${qs}&disable_animations=true`;
      const bust = isLocal || force ? `&_=${Date.now()}` : "";
      const localUrl = `${location.origin}/api?${previewQs}${bust}`;
      clearTimeout(loadTimer);
      const run = () => {
        if (!force && qs === lastPreviewUrl) return;
        lastPreviewUrl = qs;
        $("stage").classList.add("loading");
        $("previewImg").src = localUrl;
      };
      if (immediate) run();
      else loadTimer = setTimeout(run, 400);
    }

    $("previewImg").addEventListener("load", () => $("stage").classList.remove("loading"));
    $("previewImg").addEventListener("error", () => $("stage").classList.remove("loading"));

    $("layoutGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-layout]");
      if (!btn) return;
      const next = btn.dataset.layout;
      state.layout = next;
      state.width = LAYOUTS[next].width;
      state.count = LAYOUTS[next].count;
      if (next === "grid") state.columns = Math.min(2, state.count);
      $("width").value = state.width;
      $("count").value = state.count;
      $("columns").value = state.columns;
      renderLayoutButtons();
      refreshPreview(true);
    });

    $("themeGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-theme]");
      if (!btn) return;
      state.theme = btn.dataset.theme;
      renderThemeButtons();
      syncOverrideInputs();
      refreshPreview(true);
    });

    $("themePrevBtn").addEventListener("click", () => {
      if (state.themePage > 0) {
        state.themePage--;
        renderThemeButtons();
      }
    });

    $("themeNextBtn").addEventListener("click", () => {
      state.themePage++;
      renderThemeButtons();
    });

    $("bgModeSeg").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-mode]");
      if (!btn) return;
      state.bgMode = btn.dataset.mode;
      [...$("bgModeSeg").children].forEach((b) => b.classList.toggle("active", b === btn));
      refreshPreview(true);
    });

    $("stageBgSeg").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-bg]");
      if (!btn) return;
      [...$("stageBgSeg").children].forEach((b) => b.classList.toggle("active", b === btn));
      $("stage").className = `stage bg-${btn.dataset.bg}` + ($("stage").classList.contains("loading") ? " loading" : "");
    });

    $("codeTabSeg").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-tab]");
      if (!btn) return;
      state.codeTab = btn.dataset.tab;
      [...$("codeTabSeg").children].forEach((b) => b.classList.toggle("active", b === btn));
      renderCode();
    });

    $("colorOverrides").addEventListener("input", (e) => {
      const cp = e.target.dataset.cp;
      const ct = e.target.dataset.ct;
      if (cp) {
        const hex = e.target.value.slice(1);
        state.colors[cp] = hex;
        const txt = $("colorOverrides").querySelector(`[data-ct="${cp}"]`);
        if (txt) txt.value = hex;
        const clr = $("colorOverrides").querySelector(`[data-clear="${cp}"]`);
        if (clr) clr.classList.remove("hidden");
        renderCode();
      } else if (ct) {
        const clean = e.target.value.trim().replace(/^#/, "");
        if (clean === "") delete state.colors[ct];
        else state.colors[ct] = clean;
        const pic = $("colorOverrides").querySelector(`[data-cp="${ct}"]`);
        if (pic && HEX.test(clean)) pic.value = "#" + clean.slice(0, 6);
        const clr = $("colorOverrides").querySelector(`[data-clear="${ct}"]`);
        if (clr) clr.classList.toggle("hidden", !clean);
        refreshPreview();
      }
    });
    $("colorOverrides").addEventListener("change", (e) => {
      if (e.target.dataset.cp) refreshPreview(true);
    });

    $("colorOverrides").addEventListener("click", (e) => {
      const key = e.target.dataset.clear;
      if (!key) return;
      delete state.colors[key];
      syncOverrideInputs();
      refreshPreview(true);
    });

    function bindHexPair(pickerId, textId, stateKey) {
      $(pickerId).addEventListener("input", (e) => {
        const hex = e.target.value.slice(1);
        state[stateKey] = hex;
        $(textId).value = hex;
        renderCode();
      });
      $(pickerId).addEventListener("change", () => refreshPreview(true));
      $(textId).addEventListener("input", (e) => {
        const clean = e.target.value.trim().replace(/^#/, "");
        state[stateKey] = clean;
        if (HEX.test(clean)) $(pickerId).value = "#" + clean.slice(0, 6);
        refreshPreview();
      });
    }
    bindHexPair("bgSolidPicker", "bgSolidHex", "bgSolid");
    bindHexPair("grad1Picker", "grad1Hex", "grad1");
    bindHexPair("grad2Picker", "grad2Hex", "grad2");
    bindHexPair("grad3Picker", "grad3Hex", "grad3");

    function bindRange(id, stateKey) {
      $(id).addEventListener("input", (e) => {
        state[stateKey] = e.target.value;
        updateVisibility();
        renderCode();
      });
      $(id).addEventListener("change", () => refreshPreview(true));
    }
    bindRange("gradAngle", "gradAngle");
    bindRange("count", "count");
    bindRange("width", "width");
    bindRange("columns", "columns");
    bindRange("index", "index");
    bindRange("radius", "radius");

    $("thumbRatio").addEventListener("change", (e) => { state.thumbRatio = e.target.value; refreshPreview(true); });

    function applyTextInputs(force = false) {
      const rawName = $("username").value.trim().replace(/^@/, "");
      if (!rawName) {
        showToast("velog 아이디를 입력해 주세요");
        $("username").focus();
        return;
      }
      const changedUser = rawName !== state.name;
      state.name = rawName;
      state.tag = $("tag").value.trim();
      state.title = $("title").value.trim();
      if (changedUser) {
        state.tags = null;
        loadUserTags(rawName);
      }
      refreshPreview(true, force);
    }

    $("profileTagChips").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-ptag]");
      if (!btn) return;
      const tag = btn.dataset.ptag;
      const cur = state.tags !== null ? [...state.tags] : state.allTags.slice(0, 6).map((t) => t.name);
      const idx = cur.indexOf(tag);
      if (idx >= 0) cur.splice(idx, 1);
      else cur.push(tag);
      state.tags = cur;
      renderProfileTags();
      refreshPreview(true);
    });

    $("tagsDefaultBtn").addEventListener("click", () => {
      state.tags = null;
      renderProfileTags();
      refreshPreview(true);
    });

    $("tagsClearBtn").addEventListener("click", () => {
      state.tags = [];
      renderProfileTags();
      refreshPreview(true);
    });

    ["username", "tag", "title"].forEach((id) => {
      $(id).addEventListener("keydown", (e) => {
        if (e.key === "Enter") applyTextInputs(true);
      });
    });
    $("applyBtn").addEventListener("click", () => applyTextInputs(true));

    document.querySelectorAll("[data-flag]").forEach((cb) => {
      cb.addEventListener("change", (e) => {
        state.flags[e.target.dataset.flag] = e.target.checked;
        refreshPreview(true);
      });
    });

    async function copyText(text, msg) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(msg);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        showToast(msg);
      }
    }

    $("copyCodeBtn").addEventListener("click", () => copyText($("codeOutput").textContent, "코드가 복사되었습니다"));

    $("resetBtn").addEventListener("click", () => {
      Object.assign(state, {
        name: "velopert", layout: "list", theme: "light", themePage: 0, count: 5, width: 495, columns: 2,
        index: 0, thumbRatio: "0.52", radius: 10, tag: "", tags: null, title: "", bgMode: "theme",
        colors: {}, flags: {},
      });
      $("username").value = "velopert";
      $("count").value = 5;
      $("width").value = 495;
      $("columns").value = 2;
      $("index").value = 0;
      $("radius").value = 10;
      $("thumbRatio").value = "0.52";
      $("tag").value = "";
      $("title").value = "";
      document.querySelectorAll("[data-flag]").forEach((cb) => { cb.checked = false; });
      [...$("bgModeSeg").children].forEach((b) => b.classList.toggle("active", b.dataset.mode === "theme"));
      renderLayoutButtons();
      renderThemeButtons();
      syncOverrideInputs();
      loadUserTags("velopert");
      refreshPreview(true);
      showToast("설정이 초기화되었습니다");
    });

    renderLayoutButtons();
    renderThemeButtons();
    syncOverrideInputs();
    loadUserTags("velopert");
    refreshPreview(true);
  </script>
</body>
</html>
