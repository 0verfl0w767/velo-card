<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 192 192" aria-hidden="true">
          <defs>
            <linearGradient id="brandBg" x1="0" y1="0" x2="1" y2="1">

              <stop offset="100%" stop-color="#20c997"/>

              <stop offset="0%" stop-color="#099268"/>
              <stop offset="100%" stop-color="#20c997"/>
            </linearGradient>
          </defs>
          <rect width="192" height="192" rx="44" fill="url(#brandBg)"/>
          <rect x="48" y="26" width="114" height="116" rx="22" fill="#ffffff" fill-opacity="0.28"/>
          <rect x="30" y="44" width="122" height="120" rx="22" fill="#ffffff"/>
          <path fill="url(#brandV)" d="M46 69.5 L46 66 C49.8 65.1, 55.2 64.6, 59.3 64.6 C62.9 64.6, 64.5 66.3, 64.6 69.5 L65.5 89.2 C72 81.5, 76.6 73.3, 76.8 67.4 C76.8 65.4, 76.1 63.9, 74.9 62.8 C78.6 61.9, 81.8 61.5, 84.8 61.5 C88.1 61.5, 90 63.4, 90 67.3 C90 77.8, 79.4 92.6, 64.9 103.3 C61.5 103.5, 57.9 103.5, 54.3 103.5 L52.9 72.7 C52.8 70.4, 51.6 69.5, 46 69.5 Z"/>
          <rect x="97" y="68" width="40" height="10" rx="5" fill="#191f28" fill-opacity="0.85"/>
          <rect x="97" y="84" width="28" height="7" rx="3.5" fill="#8b95a1" fill-opacity="0.75"/>
          <rect x="46" y="116" width="91" height="11" rx="5.5" fill="#12b886"/>
          <rect x="46" y="135" width="64" height="11" rx="5.5" fill="#20c997" fill-opacity="0.5"/>
        </svg>
        <span>velo-card</span>
      </div>
      <button type="button" class="btn btn-sm" id="resetBtn">설정 초기화</button>
    </div>
  </header>

  <main>
    <div class="controls-col">
      <section class="panel" id="basicPanel">
        <div class="top-inputs">
          <div class="field field-user">
            <label for="username">velog 아이디</label>
            <div class="input-group">
              <div class="input-prefix">
                <span>@</span>
                <input id="username" type="text" value="velopert" placeholder="아이디" />
              </div>
              <button type="button" class="btn btn-primary" id="applyBtn">적용</button>
            </div>
          </div>
          <div class="field">
            <label for="tag">태그 필터</label>
            <input id="tag" type="text" placeholder="특정 태그만 (예: React)" />
          </div>
          <div class="field">
            <label for="title" id="titleLabel">목록 제목</label>
            <input id="title" type="text" placeholder="기본: 최근 게시글" />
          </div>
        </div>
      </section>

      <details class="panel acc" id="layoutPanel" open>
        <summary class="acc-head">
          <span class="acc-left">
            <span class="section-title">레이아웃</span>
            <span class="acc-badge" id="layoutSummary">목록 · 5개</span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="acc-body">
          <div class="layout-grid" id="layoutGrid"></div>

          <div class="sliders-grid">
            <div class="field" id="countWrap">
              <label for="count">게시글 수 <span class="val-badge" id="countVal">5</span></label>
              <input id="count" type="range" min="0" max="10" value="5" />
            </div>
            <div class="field">
              <label for="width">너비 (px) <span class="val-badge" id="widthVal">495</span></label>
              <input id="width" type="range" min="300" max="1000" step="5" value="495" />
            </div>
            <div class="field">
              <label for="scale">크기 배율 <span class="val-badge" id="scaleVal">1.2x</span></label>
              <input id="scale" type="range" min="0.7" max="2" step="0.05" value="1.2" />
            </div>
            <div class="field" id="radiusWrap">
              <label for="radius">모서리 둥글기 <span class="val-badge" id="radiusVal">10</span></label>
              <input id="radius" type="range" min="0" max="30" value="10" />
            </div>
            <div class="field hidden" id="columnsWrap">
              <label for="columns">그리드 열 <span class="val-badge" id="columnsVal">2</span></label>
              <input id="columns" type="range" min="1" max="4" value="2" />
            </div>
            <div class="field" id="indexWrap">
              <label for="index">시작 글 (0 = 최신) <span class="val-badge" id="indexVal">0</span></label>
              <input id="index" type="range" min="0" max="20" value="0" />
            </div>
            <div class="field hidden" id="ratioWrap">
              <label for="thumbRatio">썸네일 비율</label>
              <select id="thumbRatio">
                <option value="0.52">기본 (약 2:1)</option>
                <option value="wide">와이드 (2:1)</option>
                <option value="video">와이드 (16:9)</option>
                <option value="classic">클래식 (4:3)</option>
                <option value="square">정사각형 (1:1)</option>
              </select>
            </div>
          </div>
        </div>
      </details>

      <details class="panel acc tag-panel" id="tagPanel" open>
        <summary class="acc-head">
          <span class="acc-left">
            <span class="section-title">프로필 태그 선택</span>
            <span class="acc-badge" id="tagSummary">기본 6개</span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="acc-body">
          <div class="section-head" style="margin-bottom:8px">
            <span class="section-sub" id="tagPanelHint">클릭해서 추가 / 제외</span>
            <div style="display:flex;gap:5px">
              <button type="button" class="btn btn-sm" id="tagsDefaultBtn">기본 6개</button>
              <button type="button" class="btn btn-sm" id="tagsClearBtn">모두 빼기</button>
            </div>
          </div>
          <div class="tag-chips" id="profileTagChips"></div>
        </div>
      </details>

      <details class="panel acc" id="themePanel" open>
        <summary class="acc-head">
          <span class="acc-left">
            <span class="section-title">테마 및 색상</span>
            <span class="acc-badge" id="themeSummary">light</span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="acc-body">
          <div class="section-head" style="margin-bottom:8px">
            <span class="section-sub">프리셋 테마</span>
            <div class="pager">
              <button type="button" class="btn pager-btn" id="themePrevBtn" aria-label="이전 테마">&lt;</button>
              <span class="pager-info" id="themePageInfo">1 / 3</span>
              <button type="button" class="btn pager-btn" id="themeNextBtn" aria-label="다음 테마">&gt;</button>
            </div>
          </div>
          <div class="theme-grid" id="themeGrid"></div>
          <div class="bg-bar">
            <span style="font-size:11.5px;font-weight:600;color:var(--sub)">배경</span>
            <div class="seg" id="bgModeSeg">
              <button type="button" data-mode="theme" class="active">테마 기본</button>
              <button type="button" data-mode="solid">단색</button>
              <button type="button" data-mode="gradient">그라데이션</button>
              <button type="button" data-mode="transparent">투명</button>
            </div>
          </div>
          <div id="bgSolidBox" class="hidden" style="margin-bottom:8px">
            <div class="color-input">
              <input type="color" id="bgSolidPicker" value="#ffffff" />
              <input type="text" id="bgSolidHex" value="ffffff" placeholder="hex (예: 121212)" />
            </div>
          </div>
          <div id="bgGradBox" class="grad-box hidden">
            <div class="field">
              <label for="gradAngle">그라데이션 각도 <span class="val-badge" id="gradAngleVal">135</span></label>
              <input id="gradAngle" type="range" min="0" max="360" step="5" value="135" />
            </div>
            <div class="grad-stops">
              <div class="color-input">
                <input type="color" id="grad1Picker" value="#ff6b6b" />
                <input type="text" id="grad1Hex" value="ff6b6b" />
              </div>
              <div class="color-input">
                <input type="color" id="grad2Picker" value="#845ef7" />
                <input type="text" id="grad2Hex" value="845ef7" />
              </div>
              <div class="color-input">
                <input type="color" id="grad3Picker" value="#20c997" />
                <input type="text" id="grad3Hex" value="" placeholder="3색(선택)" />
              </div>
            </div>
          </div>
          <details class="sub-details">
            <summary>
              <span>세부 색상 직접 지정</span>
              <span class="section-sub">변경한 항목만 적용</span>
            </summary>
            <div class="color-grid" id="colorOverrides"></div>
          </details>
        </div>
      </details>
    </div>

    <div class="preview-col">
      <details class="panel acc" id="flagsPanel" open>
        <summary class="acc-head">
          <span class="acc-left">
            <span class="section-title">표시 옵션</span>
            <span class="acc-badge" id="activeFlagCount">기본</span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="acc-body">
          <div class="toggle-grid">
            <label class="toggle"><input type="checkbox" data-flag="hide_profile" /><span>프로필 숨김</span><span class="sw"></span></label>
            <label class="toggle"><input type="checkbox" data-flag="hide_avatar" /><span>아바타 숨김</span><span class="sw"></span></label>
            <label class="toggle"><input type="checkbox" data-flag="hide_bio" /><span>소개 숨김</span><span class="sw"></span></label>
            <label class="toggle"><input type="checkbox" data-flag="hide_stats" /><span>통계 숨김</span><span class="sw"></span></label>
            <label class="toggle"><input type="checkbox" data-flag="hide_follow" /><span>팔로우 숨김</span><span class="sw"></span></label>
            <label class="toggle"><input type="checkbox" data-flag="hide_tags" /><span>태그 숨김</span><span class="sw"></span></label>
            <label class="toggle"><input type="checkbox" data-flag="hide_description" /><span>요약 숨김</span><span class="sw"></span></label>
            <label class="toggle"><input type="checkbox" data-flag="hide_border" /><span>테두리 숨김</span><span class="sw"></span></label>
            <label class="toggle"><input type="checkbox" data-flag="disable_animations" /><span>애니메이션 끔</span><span class="sw"></span></label>
          </div>
        </div>
      </details>

      <section class="panel" id="previewPanel">
        <div class="section-head">
          <h2 class="section-title">미리보기</h2>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="seg" id="stageBgSeg">
              <button type="button" data-bg="light" class="active">밝은 배경</button>
              <button type="button" data-bg="dark">어두운 배경</button>
              <button type="button" data-bg="checker">투명 확인</button>
            </div>
            <a class="btn btn-sm" id="openTabBtn" target="_blank" rel="noopener">새 탭</a>
          </div>
        </div>
        <div class="stage bg-light" id="stage">
          <span class="status-pill" id="statusPill">불러오는 중...</span>
          <img id="previewImg" alt="velog 카드 미리보기" />
        </div>
      </section>

      <section class="panel" id="codePanel">
        <div class="section-head" style="margin-bottom:8px">
          <div class="seg" id="codeTabSeg">
            <button type="button" data-tab="markdown" class="active">Markdown</button>
            <button type="button" data-tab="html">HTML</button>
            <button type="button" data-tab="url">이미지 URL</button>
            <button type="button" data-tab="auto">다크/라이트 자동</button>
          </div>
          <button type="button" class="btn btn-sm btn-primary" id="copyCodeBtn">코드 복사</button>
        </div>
        <pre class="code-box" id="codeOutput"></pre>
      </section>
    </div>
  </main>

  <footer>
    <span>Copyright © 2026 velo-card. All rights reserved.</span>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="./app.js" defer></script>
</body>
</html>
